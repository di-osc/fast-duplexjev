[package]
name = "duplexjev"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "duplexjev"
path = "src/main.rs"

[features]
default = ["flex"]
flex = ["burn/flex"]
metal = ["burn/metal"]
cuda = ["burn/cuda"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake2 = "0.10"
burn = { version = "=0.22.1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
half = "2"
modelhub = "0.2.2"
memmap2 = "0.9"
rustfft = "6"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
